url: https://raw.githubusercontent.com/api-evangelist/incode/refs/heads/main/apis.yml
name: Incode
kind: company
description: Incode is an AI-powered identity verification and biometric authentication
  platform. The Incode Omni API runs configurable onboarding sessions that capture and
  validate government IDs, perform face match and passive liveness, run government-database
  and watchlist/AML checks, and return scores, OCR data, and images via REST.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
