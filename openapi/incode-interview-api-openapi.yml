openapi: 3.2.0
info:
  title: Incode Omni Interview API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Interview
paths:
  /omni/update:
    put:
      tags:
      - Interview
      summary: Update interview
      description: 'If upload of front, back side of id or selfie, was not successful after retries,

        use this endpoint to specify that additional manual check is needed.'
      operationId: updateinterview
      parameters:
      - name: id
        in: query
        description: Id of onboarding for which data will be updated. If not present, it will be extracted from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/update/
      x-incode-markdown: https://developer.incode.com/api-reference/update.md
  /omni/manual-review:
    put:
      tags:
      - Interview
      summary: Update manual review
      description: 'Can be used to set an interview as ''needs manual review'', ''approved by manual review'' or ''rejected by manual review''.

        In case manualReviewStatus field in request is set to APPROVED or REJECTED, notification to client side is sent

        for onboarding status change - see [notify-status-changed] for more details'
      operationId: updatemanualreview
      parameters:
      - name: interviewId
        in: query
        description: Id of onboarding for which data will be updated. If not present, it will be extracted from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManualReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/updatemanualreview/
      x-incode-markdown: https://developer.incode.com/api-reference/updatemanualreview.md
  /omni/b2b/v1/watchlist/integrator/batch:
    post:
      tags:
      - Interview
      summary: Add custom watchlist entries for child organizations
      description: Imports custom watchlist entries from a CSV file and assigns each row to the child organization identified by clientId.
      operationId: b2bIntegratorBatchWatchlistRecord
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with integrator watchlist rows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/b2b-v1-watchlist-integrator-batch/
      x-incode-markdown: https://developer.incode.com/api-reference/b2b-v1-watchlist-integrator-batch.md
  /omni/b2b/v1/sessions/continue:
    post:
      tags:
      - Interview
      summary: Continue onboarding session
      description: 'Issues a new token for an ACTIVE existing onboarding session.

        The session is located by exactly one of: its sessionId, or its externalId

        (the value supplied as externalId on /omni/start).

        Providing zero or both identifiers is rejected with 400.


        Notes:

        - Continuations count against the same per-session limits as end-user continuations.

        Works with Admin Token.'
      operationId: b2bContinueSession
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContinueRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContinueResponse'
        '400':
          description: 'Custom error statuses:

            - 4086: Current session continuation period is expired.

            - 4087: Max number of session continuations reached

            - 4088: Session is not active

            - 4089: Zero or both of sessionId / externalId provided

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Session not found for the given sessionId or externalId within the api key's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContinueResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/b2b-v1-sessions-continue/
      x-incode-markdown: https://developer.incode.com/api-reference/b2b-v1-sessions-continue.md
  /omni/b2b/onboarding/request-new:
    post:
      tags:
      - Interview
      summary: Request new onboarding for integrations
      description: This endpoint starts new onboarding session for integration and generates onboarding link.
      operationId: requestNewOnboarding
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOnboardingB2BRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewOnboardingResponse'
        '400':
          description: 'Custom error statuses:

            - 4300: Integration not found by id

            - 4301: Employee by login factor cannot be found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
      - ApiKeyAuth: []
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/b2b-onboarding-request-new/
      x-incode-markdown: https://developer.incode.com/api-reference/b2b-onboarding-request-new.md
  /omni/start:
    post:
      tags:
      - Interview
      summary: Start onboarding
      description: 'This endpoint is mandatory to start any onboarding session in Incode Omni and session can be monitored on the Incode Dashboard.

        And it generates token which should be used for the authentication of future subsequent calls.'
      operationId: startInterview
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
        '400':
          description: 'Custom error statuses:

            - 4026: Invalid uuid parameter

            - 4027: Invalid configurationId

            - 4028: Flow is not activated

            - 4081: Invalid parameters for validation

            - 4082: Start endpoint version forbidden in flow/workflow

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
      - ApiKeyAuth: []
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/start/
      x-incode-markdown: https://developer.incode.com/api-reference/start.md
  /omni/session/status/set:
    post:
      tags:
      - Interview
      summary: Set session status
      description: 'Set the status of current session. Possible actions to set the status to are: Alive, Closed or Deleted. Closed status

        disables all of the "/add/..." calls so they can no longer make any changes to the system. Deleted status deletes

        the important data stored in the session.'
      operationId: setSessionStatus
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - Alive
          - Closed
          - Deleted
      - name: id
        in: query
        description: id of the session, optional, if not sent obtained from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatusResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/session-status-set/
      x-incode-markdown: https://developer.incode.com/api-reference/session-status-set.md
  /omni/session/downloadpdf/v2:
    post:
      tags:
      - Interview
      summary: Generates single session PDF report
      description: This endpoint is used to generate a PDF report for a single session
      operationId: downloadPdfV2
      parameters:
      - name: interviewId
        in: query
        required: true
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionDownloadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/session-downloadpdf-v2/
      x-incode-markdown: https://developer.incode.com/api-reference/session-downloadpdf-v2.md
  /omni/recordings/import/third-party:
    post:
      tags:
      - Interview
      summary: Import base64Video and return recordingId
      operationId: importRecording
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreVideoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionRecordingResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/recordings-import-third-party/
      x-incode-markdown: https://developer.incode.com/api-reference/recordings-import-third-party.md
  /omni/recordings/import:
    post:
      tags:
      - Interview
      summary: Import base64Video and return recordingId
      operationId: importRecording_1
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreVideoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionRecordingResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/recordings-import/
      x-incode-markdown: https://developer.incode.com/api-reference/recordings-import.md
  /omni/qr/validate:
    post:
      tags:
      - Interview
      summary: Validate QR code uuid
      description: 'Check if provided UUID value is still valid for Interview ID.

        If valid, response will contain UUID that is stored on Onboarding cache and have default TTL of 15min

        If not valid, response will contain error details'
      operationId: validateqrcodeuuid
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrValidationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrRefreshResponse'
        '400':
          description: 'Custom error statuses:

            - 4026: Invalid uuid parameter

            - 4081: Invalid parameters for validation

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/qr-validate/
      x-incode-markdown: https://developer.incode.com/api-reference/qr-validate.md
  /omni/qr/refresh:
    post:
      tags:
      - Interview
      summary: Refresh QR code value
      description: 'Refresh UUID for already started onboarding with /omni/onboarding-url.

        Returns null if not started before this call or if start expired.

        Returned UUID is short lived (15sec) and should be refreshed in constant periods (5sec).'
      operationId: refreshqrcodevalue
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrRefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrRefreshResponse'
        '400':
          description: 'Custom error statuses:

            - 4026: Invalid uuid parameter

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/qr-refresh/
      x-incode-markdown: https://developer.incode.com/api-reference/qr-refresh.md
  /omni/process/payment-proof:
    post:
      tags:
      - Interview
      summary: Process payment proof
      description: '**Note**: This endpoint should be called once the Qr-code is executed.


        It will fetch info from add qr code text call and validate payment proof fields rfc issuer, rfc receiver and fiscal invoice and return response.


        It will also call the configured Payment Proof Webhook.'
      operationId: obtainLaborHistoryCallback
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPaymentProofResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/process-payment-proof/
      x-incode-markdown: https://developer.incode.com/api-reference/process-payment-proof.md
  /omni/process/imss:
    post:
      tags:
      - Interview
      summary: Process IMSS
      description: Trigger fetching of work history for curp. This will notify the results to the configured Work History Webhook.
      operationId: processImss
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessImssRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/process-imss/
      x-incode-markdown: https://developer.incode.com/api-reference/process-imss.md
  /omni/process/approve:
    post:
      tags:
      - Interview
      summary: Approve customer
      description: 'Approve customer for omnichannel program. Body is optional and used for auto approve when only specific features

        should be approved. It is not possible to approve twice the same user (e.g. with the same phone number).'
      operationId: approve
      parameters:
      - name: interviewId
        in: query
        description: Session id for which approval is requested.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveOnboardingResponse'
        '400':
          description: 'Custom error status:

            - 4006: User with given phone already exists

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/process-approve/
      x-incode-markdown: https://developer.incode.com/api-reference/process-approve.md
  /omni/interview-events:
    get:
      tags:
      - Interview
      summary: Fetch interview events
      description: Returns the list of all events for given interview
      operationId: getEvents
      parameters:
      - name: interviewId
        in: query
        required: true
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: codes
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: string
          uniqueItems: true
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInterviewEventsResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/getevents/
      x-incode-markdown: https://developer.incode.com/api-reference/getevents.md
  /omni/get/images/v2:
    post:
      tags:
      - Interview
      summary: Fetch image links
      description: Returns images temporary links for requested images. Links are valid for one hour
      operationId: getimageslinks
      parameters:
      - name: id
        in: query
        description: Id of onboarding for which images are requested. If not present, it will be extracted from token
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        description: Image types that are requested
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesRequest'
        required: true
      responses:
        '200':
          description: 'For each requested image type, response contains line in format:


            {imageType}: String (base64).


            Base64 representation of image. Additionally, if signature image is requested, response will contain an array of all signatures.

            '
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-images-v2/
      x-incode-markdown: https://developer.incode.com/api-reference/get-images-v2.md
  /omni/get/images-second-id/v2:
    post:
      tags:
      - Interview
      summary: Fetch image links for second id
      description: Returns seconnd id images temporary links for requested images. Links are valid for one hour
      operationId: getimageslinksforsecondid
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesRequest'
        required: true
      responses:
        '200':
          description: 'For each requested image type, response contains line in format:


            {imageType}: String (base64).


            Base64 representation of image. Additionally, if signature image is requested, response will contain an array of all signatures.

            '
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-images-second-id-v2/
      x-incode-markdown: https://developer.incode.com/api-reference/get-images-second-id-v2.md
  /omni/get/images-second-id:
    post:
      tags:
      - Interview
      summary: Fetch images second id
      description: Returns images for second id of user
      operationId: getimagessecondid
      parameters:
      - name: id
        in: query
        description: Id of onboarding for which images are requested. If not present, it will be extracted from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        description: Image types that are requested. It is strongly advised to fetch one image at the time, as response payload can be potentially big
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesRequest'
        required: true
      responses:
        '200':
          description: 'For each requested image type, response contains line in format:


            {imageType}: String (base64)


            Base64 representation of image. Additionally, if signature image is requested, response will contain an array of all signatures.

            '
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-images-second-id/
      x-incode-markdown: https://developer.incode.com/api-reference/get-images-second-id.md
  /omni/get/images:
    post:
      tags:
      - Interview
      summary: Fetch images
      description: Returns images for user
      operationId: getimages
      parameters:
      - name: id
        in: query
        description: Id of onboarding for which images are requested. If not present, it will be extracted from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        description: Image types that are requested. It is strongly advised to fetch one image at the time, as response payload can be potentially big
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesRequest'
        required: true
      responses:
        '200':
          description: 'For each requested image type, response contains line in format:


            {imageType}: String (base64)


            Base64 representation of image. Additionally, if signature image is requested, response will contain an array of all signatures.

            '
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-images/
      x-incode-markdown: https://developer.incode.com/api-reference/get-images.md
  /omni/get/concatenated-images:
    post:
      tags:
      - Interview
      summary: Fetch concatenated images
      description: Concatenates requested images from user. Resulting image keep the largest width of the requested images and preserves the order.
      operationId: getconcatenatedimages
      parameters:
      - name: id
        in: query
        description: Id of onboarding for which images are requested. If not present, it will be extracted from token.
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        description: Image types that are requested. Requested images are limited to crops only, because full frames can potentially lead to big payload in response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesRequest'
        required: true
      responses:
        '200':
          description: 'For each requested image type, response contains line in format:


            {imageType}: String (base64)


