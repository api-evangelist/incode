components:
  schemas:
    IdentityCrosscheck:
      type: object
      description: Identity cross-check score comparing account creation data with IDV extracted data
      properties:
        overall:
          $ref: '#/components/schemas/ResultBean'
          description: Overall validation result
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResultBean'
          description: Individual validation checks
        riskLevel:
          type: string
          description: Risk level assessment
          example: LOW
    ExceptionResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: UTC timestamp in milliseconds
        status:
          type: integer
          format: int32
          description: Custom error code or HTTP status code
        error:
          type: string
          description: HTTP status error
        message:
          type: string
          description: Custom error message
        path:
          type: string
          description: Endpoint path
        details:
          type: object
          description: Custom error details
    IdValidation:
      type: object
      properties:
        photoSecurityAndQuality:
          type: array
          items:
            $ref: '#/components/schemas/IdResultBean'
        idSpecific:
          type: array
          items:
            $ref: '#/components/schemas/IdResultBean'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/IdResultBean'
        appliedRule:
          $ref: '#/components/schemas/AppliedFlowRule'
        overall:
          $ref: '#/components/schemas/ResultBean'
    SessionRecordingDownloadResponse:
      type: object
      properties:
        url:
          type: string
    QrValidationRequest:
      type: object
      properties:
        urlUuid:
          type: string
          minLength: 1
        onboardingId:
          type: string
          minLength: 1
    SessionContinueResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Identifies the onboarding session that is continued. Can be used for fetching data about that session in future calls.
          maxLength: 24
          minLength: 24
        token:
          type: string
          description: Internal JWT token used for the future subsequent calls. It is the value for X-Incode-Hardware-Id header in all other calls.
          maxLength: 2048
        interviewCode:
          type: string
          description: This value is used for connecting to conference call.
          maxLength: 6
          minLength: 6
        flowType:
          type: string
          description: Type of the flow used. Could be flow (in most cases), or legacy type configuration (not used anymore).
          enum:
          - configuration
          - flow
          - workflow
        idCaptureTimeout:
          type: integer
          format: int32
          description: Number of seconds after which manual capture button should be shown to the user, while capturing ID when ID is detected.
        idDetectionTimeout:
          type: integer
          format: int32
