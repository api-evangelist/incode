    GovernmentValidation:
      type: object
      description: "- recognitionConfidence: Only present in case face validation is performed as a part of government check\n- fingerprintConfidence: Only present in case fingerprint validation is performed as a part of government check\n- minimumPassingFingerprints: Only present in case fingerprint validation is performed.\n\n     Maps to configured number of minimum fingerprints configured at the time of score calculation.\n- validationStatus: Possible values: processingIne, ok, validationError, ineConnectionError, ineInfrastructureError, moduleNotSupported,\n    missingDocumentId, missingSelfie, userNotFound, userNotFoundInIneDb, notEnoughData, livenessFail, ineNotCurrent,\n    ineReportedLost, ineReportedStolen, ineSignaturError, transactionLimitReached, geographicRegionNotSupported\n\n    Key-value mapping:\n    - -1: processingIne\n    - 0: ok\n    - 1: validationError\n    - 2: ineConnectionError\n    - 3: ineInfrastructureError\n    - 4: moduleNotSupported\n    - 5: missingDocumentId\n    - 6: missingSelfie\n    - 7: userNotFound\n    - 8: userNotFoundInIneDb\n    - 9: notEnoughData\n    - 10: livenessFail\n    - 11: ineNotCurrent\n    - 12: ineReportedLost\n    - 13: ineReportedStolen\n    - 14: ineSignaturError\n    - 99: geographicRegionNotSupported\n    - 205: transactionLimitReached\n- ocrValidation: List of value, status, key objects.\n\n    Not all of the following keys are always present: issueDate firstName, maternalLastName, paternalLastName, ocr, personalId,\n    electorsKey, emissionNumber, registrationDate\n- ocrValidationOverall: Composite result for ocrValidation score\n- credentialStatus: List of value, status, key objects carrying issuing-authority verdicts about\n    the credential itself, e.g. nonCommercialDriverLicenseStatus, indefiniteExpiration.\n\n    Informational only - these never affect the government validation score or overall status.\n    An entry is present only when the check was requested; status OK means confirmed, FAIL refuted,\n    UNKNOWN the authority did not report it.\n- overall\n"
      properties:
        recognitionConfidence:
          $ref: '#/components/schemas/ResultBean'
        fingerprintConfidence:
          $ref: '#/components/schemas/ResultBean'
        minimumPassingFingerprints:
          type: integer
          format: int32
        validationStatus:
          $ref: '#/components/schemas/IdResultBean'
        ocrValidation:
          type: array
          items:
            $ref: '#/components/schemas/IdResultBean'
        credentialStatus:
          type: array
          items:
            $ref: '#/components/schemas/IdResultBean'
        ocrValidationOverall:
          $ref: '#/components/schemas/ResultBean'
        overall:
          $ref: '#/components/schemas/ResultBean'
        provider:
          type: string
        appliedRule:
          $ref: '#/components/schemas/AppliedFlowRule'
    SessionListingDto:
      type: object
