openapi: 3.2.0
info:
  title: Incode Omni Id capture API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Id capture
paths:
  /omni/update/editable-ocr-data-second-id:
    put:
      tags:
      - Id capture
      summary: Update editable OCR data in interview for the second Id
      description: Update some of the crucial interview OCR data if needed.
      operationId: updateeditableocrdatasecondid
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEditableOcrDataRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/update-editable-ocr-data-second-id/
      x-incode-markdown: https://developer.incode.com/api-reference/update-editable-ocr-data-second-id.md
  /omni/update/editable-ocr-data:
    put:
      tags:
      - Id capture
      summary: Update editable OCR data in interview
      description: Update some of the crucial interview OCR data if needed.
      operationId: updateeditableocrdata
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEditableOcrDataRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/update-editable-ocr-data/
      x-incode-markdown: https://developer.incode.com/api-reference/update-editable-ocr-data.md
  /omni/process/second-id:
    post:
      tags:
      - Id capture
      summary: Process Second Id
      description: '**Note**: This endpoint should be called only after the upload of front-side-secondId and

        back-side-secondId is over. And in case of passports or only front sided documents, only

        front-side-secondId should be over.


        Incode validations and ocr parsing are processed during this endpoint. To fetch ocr data call

        Fetch-SecondId_OCR. Parameter queueName is needed so it can be determined in which queue

        interview should go. Once this is called, user is no longer able to upload ID (front or back side).'
      operationId: processSecondId
      parameters:
      - name: queueName
        in: query
        required: false
        schema:
          type: string
          description: 'The name of the queue, user is entering in case conference call will be used. If not set, default queue will be used.

            '
          enum:
          - aristotle
          - buddha
          - confucius
          - diogenes
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessIdResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/process-second-id/
      x-incode-markdown: https://developer.incode.com/api-reference/process-second-id.md
  /omni/process/id:
    post:
      tags:
      - Id capture
      summary: Process Id
      description: '**Note**:This endpoint should be called only after the front-side

        and back-side is over.

        And in case of passports or only front sided documents, only front-side should be over.


        Incode validations and ocr parsing are processed during this endpoint. To fetch ocr data call Fetch-OCR.


        Once this is called, user is no longer able to upload ID (front or back side).'
      operationId: processId
      parameters:
      - name: queueName
        in: query
        description: The name of the queue, user is entering in case conference call will be used. If not set, default queue will be used
        required: false
        schema:
          type: string
          enum:
          - aristotle
          - buddha
          - confucius
          - diogenes
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessIdResponseDto'
        '400':
          description: 'Custom error statuses:

            - 4085: ID image is too small. The message contains the received dimensions and the required minimum (the smallest image side must be at least 200 px).

            - 6000: Processing error (generic failure during ID processing)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/process-id/
      x-incode-markdown: https://developer.incode.com/api-reference/process-id.md
  /omni/add/front-second-id/v2:
    post:
      tags:
      - Id capture
      summary: Add front side of Second ID
      description: This endpoint is used for storing front side of second id for further processing
      operationId: addFrontSecondIdV2
      parameters:
      - name: onlyFront
        in: query
        description: Flag stating if document is one-sided (like Passport). Default value is false, in case it is not sent.
        required: false
        schema:
          type: boolean
          default: false
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdCaptureV2Request'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddIdResponse'
        '400':
          description: 'Custom error statuses:

            - 4019: Face not found

            - 1003: Face cropping failure

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-front-second-id-v2/
      x-incode-markdown: https://developer.incode.com/api-reference/add-front-second-id-v2.md
  /omni/add/front-id/v2:
    post:
      tags:
      - Id capture
      summary: Add front side of ID
      description: 'This endpoint is used for storing front side of id for further processing. Image quality check is performed during that call.

        Number of retries is not limited.


        Once process-id is finished, this endpoint cannot be called for retries.


        **Note: Front side of id should be uploaded before back-side**


        **Image requirements**: the smallest side of the image must be at least 200 px.

        A smaller image can pass this capture step, but process-id rejects it with error status 4085 ("ID image is too small.").

        Images larger than 2048 px on the longest side are scaled down automatically.'
      operationId: addFrontIdV2
      parameters:
      - name: onlyFront
        in: query
        description: Flag stating if document is one-sided (like Passport)
        required: false
        schema:
          type: boolean
          default: false
      - name: extractIdFace
        in: query
        description: When false, skips biometric face extraction and template creation from the front ID. Default true.
        required: false
        schema:
          type: boolean
          default: true
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        description: Front side of id. In case of passport, this should be page with all data about user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdCaptureV2Request'
        required: true
      responses:
        '200':
          description: 'In case there''s some issue when calling the endpoint due to classification failed, an issue such as bad quality,

            or any of the fail reasons the response will always have the field:

            - classification

            - failReason

            - sharpness

            - glare

            - horizontalResolution


            We recommend considering the call as failed if there''s a failReason in the response or if the classification is false.

            Possible values for fail reason:

            - UNKNOWN_DOCUMENT_TYPE: document classification failed

            - WRONG_DOCUMENT_SIDE: can happen when uploading back side of id when front id is required or the other way around

            - WRONG_ONE_SIDED_DOCUMENT: uploading wrong document with only one side

            - WRONG_UNFOLDED_DOCUMENT: uploading unfolded document with unrecognizable sides

            - UNFOLDED_DOCUMENT_PAGE_MISMATCH: uploading unfolded document with mismatching sides

            - DOCUMENT_NOT_READABLE: document couldn''t be read, probably due to image quality

            - UNABLE_TO_ALIGN_DOCUMENT: alignment failed

            - ID_TYPE_UNACCEPTABLE: invalid type of id

            - UNEXPECTED_ERROR_OCCURRED: unexpected error


            Whenever the classification is done successfully the fields that will always be present are:

            - classification

            - sharpness

            - glare

            - horizontalResolution

            - readability

            - typeOfId

            - sessionStatus


            The remaining fields could be optional depending on the specific type of id and country of origin.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddIdResponse'
        '400':
          description: 'Custom error statuses:

            - 1003: Face cropping failure

            - 4004: Could not find user

            - 4019: Face not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-front-id-v2/
      x-incode-markdown: https://developer.incode.com/api-reference/add-front-id-v2.md
  /omni/add/document-id:
