  /omni/add/back-second-id/v2:
    post:
      tags:
      - Id capture
      summary: Add back side of Second ID
      description: 'Image quality check is performed during that call. Number of retries is not limited. Once id processing is finished,

        this endpoint cannot be called for retries. Front side of id should be uploaded before back side. In case of passport,

        this endpoint should not be called.'
      operationId: addBackSecondIdV2
      parameters:
      - name: captureType
        in: query
