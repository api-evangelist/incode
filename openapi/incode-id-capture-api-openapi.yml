        sessionStatus:
          type: string
          description: Session status
          enum:
          - Alive
          - Closed
          - Deleted
        isDocumentExpired:
          type: boolean
          description: Flag indicating if the document is expired.
    AddressBean:
      type: object
      properties:
        street:
          type: string
          description: Street line in the way it is read from address string.
        streetName:
          type: string
          description: Street name without exterior and interior numbers.
        colony:
          type: string
          description: Colony line the way it is read from address string. (Not applicable for all countries)
        postalCode:
          type: string
          description: Postal code in the way it is read from address string.
        city:
          type: string
          description: City in the way it is read from address string.
        state:
          type: string
          description: State in the way it is read from address string.
        stateName:
          type: string
          description: Full StateName.
        district:
          type: string
          description: District in the way it is read from address string.
        stateCode:
          type: string
          description: State code if applicable.
        addressCountryCode:
          type: string
          description: Address country code if applicable.
        label:
          type: string
          description: Full address label.
        exteriorNumber:
          type: string
          description: Exterior street number.
        interiorNumber:
          type: string
          description: Interior street number.
        addressLine1:
          type: string
          description: The primary line in the address that contains the most essential details for locating a place.
        streetType:
          type: string
          description: Street type
    AddIdResponse:
      type: object
      properties:
        correctSharpness:
          type: boolean
          description: It's true if the sharpness of the ID meets the requirements.
        correctGlare:
          type: boolean
          description: It's true if the glare of the ID meets the requirements.
        horizontalResolution:
          type: integer
          format: int32
          description: Value is based on the resolution of the cropped photo. Low value means after performing the crop we have a bad quality of image. We recommend to retry capture if value is below 155.
        shadowConfidence:
          type: number
          format: float
          description: Value 0 means it is no shadow on the image and image quality is good, while value 1 represents bad quality of image with a lot of shadow. We recommend to retry capture if value is 1.
          maximum: 1
          minimum: 0
        classification:
          type: boolean
          description: If true, server classified image as a front side of an id. If false, server failed to classify image as valid front side of an id or passport and other parameters can be ignored.
        readability:
          type: boolean
          description: If true, server can properly read ID. If false server failed to read some key places of the ID.
        typeOfId:
          type: string
          enum:
          - Unknown
          - Passport
          - Visa
          - DriversLicense
          - IdentificationCard
          - Permit
          - Currency
          - ResidenceDocument
          - TravelDocument
          - BirthCertificate
          - VehicleRegistration
          - Other
          - WeaponLicense
          - TribalIdentification
          - VoterIdentification
          - Military
          - TaxIdentification
          - FederalID
          - MedicalCard
        issueYear:
          type: integer
          format: int32
          description: Issue year of the ID.
        issueName:
          type: string
          description: Description of the ID. Could contain country code, state, type of ID, subtype of ID.
        curpCheck:
          type: boolean
          description: Only for Mexican IDs. Flag stating if curp was properly read.
        sessionStatus:
          type: string
          description: Session Status
          enum:
          - Alive
          - Closed
          - Deleted
        countryCode:
          type: string
          description: Valid ISO alpha-2 or alpha-3 code of the ID issuing country.
        state:
          type: string
          description: Issuing state of the ID.
        failReason:
          type: string
          description: Classification fail reason
          enum:
          - UNKNOWN_DOCUMENT_TYPE
          - WRONG_DOCUMENT_SIDE
          - WRONG_ONE_SIDED_DOCUMENT
          - UNFOLDED_DOCUMENT_PAGE_MISMATCH
          - WRONG_UNFOLDED_DOCUMENT
          - DOCUMENT_NOT_READABLE
          - UNABLE_TO_ALIGN_DOCUMENT
          - ID_TYPE_UNACCEPTABLE
          - UNEXPECTED_ERROR_OCCURRED
          - DIGITAL_ID_REQUESTED_BUT_OTHER_PROVIDED
        skipBackIdCapture:
          type: boolean
          description: Flag that signals if back id capture should be skipped or not.
        forceFrontIdCapture:
          type: boolean
          description: Flag that signals if front id capture must be executed after back.
        showMandatoryConsent:
          type: boolean
          description: Render mandatory consent page based on this parameter value.
        regulationType:
          type: string
          description: Regulation type for the mandatory consent (only if showMandatoryConsent set to true).
        skipGlareFront:
          type: boolean
          description: Flag that signals if front side glare should be ignored.
        skipGlareBack:
          type: boolean
          description: Flag that signals if back side glare should be ignored.
        documentIsOnTheEdge:
          type: boolean
          description: Flag that signals if document is on the edge on the full frame image.
        acceptedDocuments:
          type: array
          description: List of accepted documents for that particular country in case of ID_TYPE_UNACCEPTABLE failReason.
          items:
            type: string
            enum:
            - Unknown
            - Passport
            - Visa
            - DriversLicense
            - IdentificationCard
            - Permit
            - Currency
            - ResidenceDocument
            - TravelDocument
            - BirthCertificate
            - VehicleRegistration
            - Other
            - WeaponLicense
            - TribalIdentification
            - VoterIdentification
            - Military
            - TaxIdentification
            - FederalID
            - MedicalCard
          uniqueItems: true
        imageRedacted:
          type: boolean
          description: Flag that signals if image was redacted as part of the ID capture.
        idFaceExtractionSkipped:
          type: boolean
          description: True when biometric face extraction from the front ID was skipped because the client passed extractIdFace=false. While this flag is true, face-match flows that require an ID-side template cannot run; the flag is cleared on a subsequent add/front-id call where extractIdFace is true (or omitted).
        captureAttemptsLimit:
          $ref: '#/components/schemas/CaptureAttemptsLimitDto'
          description: Checked only if configured in the session flow.
        idQualityAttemptApproved:
          type: boolean
          description: ID quality check result based on ML readability estimation. True if perFieldReadability >= 0.38, false otherwise. Only available for Mexican documents when feature is enabled.
        isDocumentExpired:
          type: boolean
          description: Flag indicating if the document side is expired.
        attemptId:
          type: string
          description: Created attempt id.
