  /omni/cross-doc-data-check/results:
    get:
      tags:
      - Id capture
      summary: Get cross-document comparison results
      description: Fetch cross-document data check results for a given interview ID. If no ID is provided, it defaults to the user's ID from the JWT.
      operationId: cross-doc-check-results
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Response contains a map of results with detailed comparison information.
          content:
            application/json:
              schema:
                type: string
                example:
                  additionalProp1:
                  - interviewId: string
                    comparisonName: string
                    comparisonId: string
                    result: OK
                    leftValueDetails:
                      documentType: string
                      fieldName: string
                      value: {}
                      sourceNotFound: true
                    rightValueDetails:
                      documentType: string
                      fieldName: string
                      value: {}
                      sourceNotFound: true
                    severity: ultra_low
                  additionalProp2:
                  - interviewId: string
                    comparisonName: string
                    comparisonId: string
                    result: OK
                    leftValueDetails:
                      documentType: string
                      fieldName: string
                      value: {}
                      sourceNotFound: true
                    rightValueDetails:
                      documentType: string
                      fieldName: string
                      value: {}
                      sourceNotFound: true
                    severity: ultra_low
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/cross-doc-data-check-results/
      x-incode-markdown: https://developer.incode.com/api-reference/cross-doc-data-check-results.md
components:
  schemas:
    ExceptionResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: UTC timestamp in milliseconds
        status:
          type: integer
          format: int32
          description: Custom error code or HTTP status code
        error:
          type: string
          description: HTTP status error
        message:
          type: string
          description: Custom error message
        path:
          type: string
          description: Endpoint path
        details:
          type: object
          description: Custom error details
    CustomerEditableOcrDataRequest:
      type: object
      properties:
        address:
          type: string
        documentNumber:
          type: string
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        paternalLastName:
          type: string
        maternalLastName:
          type: string
        personalNumber:
          type: string
        curp:
          type: string
        email:
          type: string
        birthDate:
          type: string
        expireAt:
          type: string
        gender:
          type: string
    IdCaptureV2Request:
      type: object
      properties:
        base64Image:
          type: string
