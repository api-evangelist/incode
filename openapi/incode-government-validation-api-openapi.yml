    Brazil:
      type: object
      description: Response model for Brazil government validation
      properties:
        valid:
          type: boolean
        statusCode:
          type: integer
          format: int32
        governmentValidation:
          $ref: '#/components/schemas/GovernmentValidation'
          description: "    - recognitionConfidence: Present when government face validation is attempted (e.g. SERPRO_FACE).\n        - value: \"100.0\" when face matched, \"0.0\" when no match or face not in SERPRO DB\n        - status: OK when face matched, FAIL when no match or face not in SERPRO DB\n    - validationStatus: Key-value mapping:\n        - OK (0, \"ok\"): CPF found, data and/or face matched\n        - VALIDATION_ERROR (1, \"validationError\")\n        - MODULE_NOT_SUPPORTED (4, \"moduleNotSupported\")\n        - MISSING_SELFIE (6, \"missingSelfie\"): selfie required for SERPRO_FACE\n        - USER_NOT_FOUND (7, \"userNotFound\"): CPF not found in government DB, or face not matched\n        - CPF_NUMBER_INVALID_OR_MISSING (16, \"cpfNumberInvalidOrMissing\")\n        - CONNECTION_ERROR (17, \"connectionError\")\n        - PROVIDER_NOT_CONFIGURED (96, \"providerNotConfigured\")\n        - PROVIDER_UNAVAILABLE (98, \"providerUnavailable\")\n        - GEOGRAPHIC_REGION_NOT_SUPPORTED (99, \"geographicRegionNotSupported\")\n    - ocrValidation: List of value/status/key objects. Keys present for Brazil:\n        - documentNumber: CPF validity check\n        - fullName: name match (derived from firstName, paternalLastName, maternalLastName — all map to the same SERPRO nome field and always share the same status)\n        - birthDate: date of birth match\n        Not all keys are always present.\n    - ocrValidationOverall: Composite result for ocrValidation score\n    - overall: Equals ocrValidationOverall for SERPRO; for SERPRO_FACE the face recognitionConfidence can override it\n        (e.g. face not in DB / not matched drives overall to 0.0 FAIL even when ocrValidationOverall is OK)\n"
        errorDescription:
          type: string
