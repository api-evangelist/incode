openapi: 3.2.0
info:
  title: Incode Omni API validations API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: API validations
  description: 'Standalone API validations that are not related to any interview or onboarding process. This helps with various

    identity verifications specific to certain countries such as CURP and INE in Mexico or SSN in USA.'
paths:
  /api/validate/vin:
    post:
      tags:
      - API validations
      summary: Vehicle Identification Number Validation
      description: Validate a VIN number and obtain data related to reports about crashes, theft, etc.
      operationId: validateVin
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VinRequest'
        required: true
      responses:
        '200':
          description: "- id: String.\n- vin: String.\n- attributes: Object with following fields.\n    - vin: String.\n    - year: String.\n    - make: String.\n    - model: String.\n    - type: String.\n    - made_In: String.\n    - style: String.\n    - engine: String.\n- success: Boolean.\n- error: String.\n- base64PDF: String.\n"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/api-validate-vin/
      x-incode-markdown: https://developer.incode.com/api-reference/api-validate-vin.md
  /api/validate/ssn:
    post:
      tags:
      - API validations
      summary: SSN Validation
      description: Validate a social security number and the person associated with it.
      operationId: validateSsn
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSsnRequest'
        required: true
      responses:
        '200':
          description: '- requestId: Int. Response''s status, check catalog.

            - ssnValid: Boolean. Indicates if ssn information sent is valid.

            - deceasedPerson: Boolean. Indicates if information sent corresponds to a deceased person.

            - errorCode: String. Error code in case something goes wrong.

            - errorCodeDescription: String. Error description in case something goes wrong or if ssn is not valid.

            '
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/api-validate-ssn/
      x-incode-markdown: https://developer.incode.com/api-reference/api-validate-ssn.md
  /api/validate/rfc:
    post:
      tags:
      - API validations
      summary: RFC validation
      description: Check for valid RFC. If RFC is not found then validRFC field will be false.
      operationId: validaterfc
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RFCRequest'
        required: true
      responses:
        '200':
          description: RFC validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfcValidationResponse'
              examples:
                Valid RFC:
                  description: Valid RFC
                  value:
                    validRFC: true
                    status: OK
                    message: RFC Valido
                    rfcType: F
                    messageCode: '0'
                Invalid RFC:
                  description: Invalid RFC
                  value:
                    validRFC: false
                    status: ERROR
                    errorMessage: El RFC ingresado no se encuentra en la lista de RFC no cancelados
        '400':
          description: Invalid RFC format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
              examples:
                Invalid RFC Format:
                  description: Invalid RFC Format
                  value:
                    timestamp: 1622548800000
                    status: 400
                    error: Bad Request
                    message: 'BadRequestException: Invalid curp'
                    path: /api/validate/rfc
                Missing RFC:
                  description: Missing RFC
                  value:
                    timestamp: 1622548800000
                    status: 400
                    error: Bad Request
                    message: must not be blank
                    path: /api/validate/rfc
        '500':
          description: Internal server error during validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
              examples:
                Service Unavailable:
                  description: Service Unavailable
                  value:
                    timestamp: 1622548800000
                    status: 500
                    error: Internal Server Error
                    path: /api/validate/rfc
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/api-validate-rfc/
      x-incode-markdown: https://developer.incode.com/api-reference/api-validate-rfc.md
  /api/validate/rfc-by-curp/v2:
    post:
      tags:
      - API validations
      summary: RFC validation by CURP v2
      description: 'Check for valid CURP, use obtained data to calculate RFC and then validate the RFC.

        If CURP is not found then renapo_valid field will be false.'
      operationId: validaterfcbycurpv2
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurpRequest'
        required: true
      responses:
        '200':
          description: Respuesta con validación de CURP
          content:
            application/json:
              examples:
                Successful CURP Validation:
                  summary: Successful CURP Validation
                  description: Successful CURP Validation
                  value:
                    success: true
                    curp: XXXX820814HDFABC01
                    sex: MUJER
                    nationality: MEX
                    result: success
                    requestData:
                      name: JUANA
                      firstLastName: PEREZ
                      secondLastName: LOPEZ
                      gender: M
                      birthDate: 14/08/1982
                      state: DF
                    transactionId: transaction1234567890
                    renapo_valid: true
                    names: JUANA
                    paternal_surname: PEREZ
                    mothers_maiden_name: LOPEZ
                    birthdate: 14/08/1982
                    entity_birth: DF
                    probation_document: '1'
                    probation_document_data:
                      foja: ''
                      numEntidadReg: 09
                      libro: ''
                      NumRegExtranjeros: ''
                      cveEntidadNac: DF
                      numActa: '00001'
                      CRIP: ''
                      tomo: ''
                      cveEntidadEmisora: ''
                      anioReg: '1982'
                      cveMunicipioReg: '001'
                      FolioCarta: ''
                    status_curp: RCN
                    deceasedStatus: ALIVE
                CURP not found:
                  summary: CURP not found
                  description: CURP not found
                  value:
                    success: false
                    error:
                      codigoError: '06'
                      resultCURPS:
                        numEntidadReg: ''
                        apellidoPaterno: ''
                        libro: ''
                        statusCurp: ''
                        cveEntidadNac: ''
                        numActa: ''
                        CRIP: ''
                        tomo: ''
                        cveEntidadEmisora: ''
                        FolioCertificado: ''
                        anioReg: ''
                        cveMunicipioReg: ''
                        FolioCarta: ''
                        CURP: ''
                        apellidoMaterno: ''
                        nombres: ''
                        nacionalidad: ''
                        foja: ''
                        NumRegExtranjeros: ''
                        fechNac: ''
                        sexo: ''
                        docProbatorio: ''
                      statusOper: NO EXITOSO
                      tipoError: '01'
                      sessionID: xF1hOzrjnJU36wDsPl83KlkDpE-eb7tM1Oe2bjI0jrbPJv-mU3IF!1562844632!1749682961123
                      message: La CURP no se encuentra en la base de datos
                    result: 'Not valid request: La CURP no se encuentra en la base de datos code: 06'
                    transactionId: xF1hOzrjnJU36wDsPl83KlkDpE-eb7tM1Oe2bjI0jrbPJv-mU3IF!1562844632!1749682961123
                    renapo_valid: false
                Daily Rate Limit Exceeded:
                  summary: Daily Rate Limit Exceeded
                  description: Daily Rate Limit Exceeded
                  value:
                    success: false
                    error:
                      codigoError: '02'
                      tipoError: '99'
                      message: SE HA ALCANZADO EL LIMITE DE TRANSACCIONES PERMITIDAS POR DIA
                    result: SE HA ALCANZADO EL LIMITE DE TRANSACCIONES PERMITIDAS POR DIA
                    renapo_valid: false
                Curp status not acceptable:
                  summary: Curp status not acceptable
                  description: Curp status not acceptable
                  value:
                    success: false
                    sessionStatus: Alive
                    error:
                      codigoError: '02'
                      tipoError: '99'
                      message: Curp status is not acceptable.
                    result: 'Error: STATUS CURP not acceptable.'
                    renapo_valid: false
        '400':
          description: Bad Request
          content:
            application/json:
