      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-conference-notes/
      x-incode-markdown: https://developer.incode.com/api-reference/add-conference-notes.md
  /omni/add/notes:
    post:
      tags:
      - Video conference
      summary: Add notes
      description: This endpoint is used for adding notes for interview/session.
      operationId: addNotes_1
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNotesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-notes/
      x-incode-markdown: https://developer.incode.com/api-reference/add-notes.md
  /omni/add/conference/feedback:
    post:
      tags:
      - Video conference
      summary: Add conference feedback
      description: This endpoint is used for adding conference feedback for the interview/session.
      operationId: addConferenceFeedback
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConferenceFeedback'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-conference-feedback/
      x-incode-markdown: https://developer.incode.com/api-reference/add-conference-feedback.md
  /omni/add/conference-module:
    post:
      tags:
      - Video conference
      summary: Add conference module
      description: Add conference module with name, url and icon (base64).
      operationId: addConferenceModule
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConferenceModuleRequest'
        required: true
      responses:
