openapi: 3.2.0
info:
  title: Incode Omni Video conference API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Video conference
paths:
  /omni/queue/conference/add:
    put:
      tags:
      - Video conference
      summary: Add user to queue
      description: 'When data collection is over, users can be added to the queue for joining conference calls with an executive. The average

        time for before user joins to conference is given in response.'
      operationId: addToQueue
      parameters:
      - name: queueName
        in: query
        description: 'The name of the queue, user is entering in case a conference call will be used. If not set, default queue will be used.

          Possible values: aristotle, buddha, confucius, diogenes. Same value for queueName needs to be used across all requests

          in one onboarding session.

          '
        required: false
        schema:
          type: string
          default: ''
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyInterviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddToQueueResponse'
        '400':
          description: 'Custom error status:

            - 4014: Invalid interview code

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/queue-conference-add/
      x-incode-markdown: https://developer.incode.com/api-reference/queue-conference-add.md
  /omni/finish:
    put:
      tags:
      - Video conference
      summary: Finish interview
      description: Finish the interview and remove customer from the queue.
      operationId: finishInterview
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishInterviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishInterviewResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/finish/
      x-incode-markdown: https://developer.incode.com/api-reference/finish.md
  /omni/verifyFace:
    post:
      tags:
      - Video conference
      summary: Verify face
      description: 'A bank executive can ask the customer to additionally capture his face during an interview and do face recognition.

        A face can be captured from selfie or ID that a customer places in front of camera.'
      operationId: recognize
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebappRecognizeResponse'
        '400':
          description: 'Custom error statuses:

            - 4019: Face not found

            - 1003: Face cropping failure

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/verifyface/
      x-incode-markdown: https://developer.incode.com/api-reference/verifyface.md
  /omni/record-stop:
    post:
      tags:
      - Video conference
      summary: Stop recording
      description: Stop recording the interview.
      operationId: interviewStopRecord
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewStopRecordRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/record-stop/
      x-incode-markdown: https://developer.incode.com/api-reference/record-stop.md
  /omni/record-start:
    post:
      tags:
      - Video conference
      summary: Start recording
      description: Start recording of the interview.
      operationId: interviewStartRecord
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewStartRecordRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStartRecordResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/record-start/
      x-incode-markdown: https://developer.incode.com/api-reference/record-start.md
  /omni/queue/conference/disconnect:
    post:
      tags:
      - Video conference
      summary: Disconnect user from the queue
      description: Users can disconnect themselves while waiting in the queue at any time.
      operationId: customerDisconnect
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: 'success: flag indicating if user was successfully removed from the queue. False in the case the user not found in the queue, true otherwise

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/queue-conference-disconnect/
      x-incode-markdown: https://developer.incode.com/api-reference/queue-conference-disconnect.md
  /omni/conference/report-issue:
    post:
      tags:
      - Video conference
      summary: Report conference issue
      description: An executive can report any issue by this call.
      operationId: reportIssue
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportIssueRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/conference-report-issue/
      x-incode-markdown: https://developer.incode.com/api-reference/conference-report-issue.md
  /omni/conference/photo:
    post:
      tags:
      - Video conference
      summary: Store conference photos
      description: A bank executive can ask the customer to additionally capture his face or document. These will be stored in DB.
      operationId: storePhotos
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfStoreRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/conference-photo/
      x-incode-markdown: https://developer.incode.com/api-reference/conference-photo.md
  /omni/conference/add/event:
    post:
      tags:
      - Video conference
      summary: Add conference event
      description: Send (OpenTok) conference event. Any connection issue caught by webapp could be reported using this call.
      operationId: addConferenceEvent
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConferenceEvent'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/conference-add-event/
      x-incode-markdown: https://developer.incode.com/api-reference/conference-add-event.md
  /omni/chat:
    post:
      tags:
      - Video conference
      summary: Send conference chat
      description: Store conference chat. The executive should send the whole chat at the end of conference call (just before finish is called).
      operationId: saveChat
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/chat/
      x-incode-markdown: https://developer.incode.com/api-reference/chat.md
  /omni/add/conference/notes:
    post:
      tags:
      - Video conference
      summary: Add notes
      description: This endpoint is used for adding notes for interview/session.
      operationId: addNotes
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
