openapi: 3.2.0
info:
  title: Incode Omni Document capture API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Document capture
paths:
  /omni/attach-stamp-on-annotation:
    post:
      tags:
      - Document capture
      summary: Attach stamp on annotation
      description: 'Substitute stamps from interview to previously uploaded PDF contracts at all places with pdf text annotations. Annotations

        must contain text with preselected values. Preselected values are:

        - NAME (NAME_STAMP),

        - ADDRESS (ADDRESS_STAMP),

        - DATE #ZoneId# #Format#,

        - AGE,

        - SEX,

        - DOB #Format#,

        - COUNTRY,

        - STATE,

        - PHONE,

        - TIME #ZoneId# #Format#,

        - SECOND_NAME*


        Replace parameter ZoneId with full size zone using time zones used in Java8 TimeDate API Replace parameter Format with format

        you wish to display the time and date


        Stamps are added in Helvetica, size 13. Endpoint is intended to be used as fluent api. One call to the api gives in

        responses id of the signed document which can then be used in the subsequent call to continuously add another signature on a different annotation.'
      operationId: addStampToPdfOnAnnotation
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachStampOnAnnotationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/attach-stamp-on-annotation/
      x-incode-markdown: https://developer.incode.com/api-reference/attach-stamp-on-annotation.md
  /omni/add/document/v3:
    post:
      tags:
      - Document capture
      summary: Add document V3
      description: Upload document image gathered and store data.
      operationId: adddocumentv3
      parameters:
      - name: type
        in: query
        description: '- **signature**: Upload user''s digital signature. This can be later fetched in get images endpoint.

          - **document**: Upload user''s proof of address document. This can be later fetched in get images endpoint.

          - **addressStatement**: (Legacy) Upload user''s proof of address document. Used for backward compatibility. Use type ''document'' instead.

          - **contract**: Upload contract image.

          - **v5cMultiPageLogbook**: Upload single page (image) of V5C logbook multi page document.

          - **carInvoice**: Upload single page (image) of two pages car invoice document.

          - **financeSettlement**: Upload single page (image) of two pages finance settlement letter.

          - **w8Ben**: Upload IRS W-8BEN form as a single page image or a PDF.

          - **w8BenE**: Upload one page (image) of the multi page IRS W-8BEN-E form, or the complete form as a PDF. Finish with the finalize document endpoint.

          '
        required: true
        schema:
          type: string
          enum:
          - signature
          - document
          - contract
          - v5cMultiPageLogbook
          - carInvoice
          - financeSettlement
          - w8Ben
          - w8BenE
      - name: title
        in: query
        description: Only if type is contract. Title of contract.
        required: false
        schema:
          type: string
      - name: format
        in: query
        description: Only if type is document. Possible values are image (jpg and png supported) or pdf. Default is image.
        required: false
        schema:
          type: string
          enum:
          - image
          - pdf
      - name: processingMethod
        in: query
        description: Only applicable for some documents. Possible values are sync and async. Default is sync.
        required: false
        schema:
          type: string
          default: sync
          enum:
          - sync
          - async
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/add-document-v3/
      x-incode-markdown: https://developer.incode.com/api-reference/add-document-v3.md
  /omni/add/document/v2:
