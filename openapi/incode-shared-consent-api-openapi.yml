openapi: 3.2.0
info:
  title: Incode Omni Shared consent API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Shared consent
paths:
  /omni/sign-combined-consent:
    post:
      tags:
      - Shared consent
      summary: Sign combined consents with checkboxes
      description: Receives information about which checkboxes user signed.
      operationId: signcombinedconsent
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignCombinedConsentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/sign-combined-consent/
      x-incode-markdown: https://developer.incode.com/api-reference/sign-combined-consent.md
  /omni/get/combined-consent:
    get:
      tags:
      - Shared consent
      summary: Get combined consent for requested language
      description: Fetches combined consent for requested language.
      operationId: getcombinedconsent
      parameters:
      - name: id
        in: query
        description: Consent id
        required: false
        schema:
          type: string
      - name: language
        in: query
        required: true
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageConsentDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-combined-consent/
      x-incode-markdown: https://developer.incode.com/api-reference/get-combined-consent.md
