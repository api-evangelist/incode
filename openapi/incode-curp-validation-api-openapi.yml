                      FolioCarta: ''
                    status_curp: RCN
                    deceasedStatus: ALIVE
                CURP not found:
                  summary: CURP not found
                  description: CURP not found
                  value:
                    success: false
                    error:
                      codigoError: '06'
                      resultCURPS:
                        numEntidadReg: ''
                        apellidoPaterno: ''
                        libro: ''
                        statusCurp: ''
