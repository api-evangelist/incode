components:
  schemas:
    ExceptionResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: UTC timestamp in milliseconds
        status:
          type: integer
          format: int32
          description: Custom error code or HTTP status code
        error:
          type: string
          description: HTTP status error
        message:
          type: string
          description: Custom error message
        path:
          type: string
          description: Endpoint path
        details:
          type: object
          description: Custom error details
    CurpDataRequest:
      type: object
      properties:
        curp:
          type: string
          description: User's curp. Has to be in valid format. If it isn't present, then curp value from interview is used.
          example: COHJ950918HCMVRS09
        name:
          type: string
          minLength: 1
        firstLastName:
          type: string
          minLength: 1
        secondLastName:
          type: string
        gender:
          type: string
          description: Valid gender values are "H" (Hombre, male), "M" (mujer, female) and "X" (otro, other)
          enum:
          - H
          - M
          - X
          minLength: 1
        birthDate:
          type: string
          format: dd/mm/yyyy
          example: 07/06/1995
          minLength: 1
        state:
          type: string
          example: CM
          minLength: 1
        externalId:
          type: string
          example: bdac7bdd-9339-4f85-9b32-bc90d553ddc6
    CurpResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Flag indicating request passed successfully.
        curp:
          type: string
          description: Curp
        sex:
          type: string
          description: Sex
          enum:
          - Mujer
          - Hombre
          - X
        nationality:
          type: string
          description: Nationality
        result:
          type: string
        transactionId:
          type: string
        renapo_valid:
          type: boolean
          description: Flag indicating if CURP validation passed - tipoError present in response
        names:
          type: string
          description: Names
        paternal_surname:
          type: string
          description: Paternal surname
        mothers_maiden_name:
          type: string
          description: Mother maiden name
        birthdate:
          type: string
          description: Birth Date in format DD/MM/YYYY
        entity_birth:
          type: string
          description: Birth State
        probation_document:
          type: string
          description: Probation Document
        probation_document_data:
          type: object
          additionalProperties:
            type: object
          description: 'Key/Value structure. All keys are type of string. Available Key values:

            - anioReg

            - foja

            - tomo

            - libro

            - numActa

            - CRIP

            - numEntidadReg

            - cveMunicipioReg

            - NumRegExtranjeros

            - FolioCarta

            - cveEntidadNac

            - cveEntidadEmisora

            '
        status_curp:
          type: string
          description: Status Curp
        deceasedStatus:
          type: string
          description: Deceased Status
    AddCurpRequest:
      type: object
      properties:
        curp:
          type: string
          description: User's curp. Has to be in valid format. If it isn't present, then curp value from interview is used.
          example: COHJ950918HCMVRS09
    CurpRequest:
      type: object
      properties:
        curp:
          type: string
          minLength: 1
        externalId:
          type: string
          example: bdac7bdd-9339-4f85-9b32-bc90d553ddc6
  parameters:
    ApiVersion:
      name: api-version
      in: header
      required: true
      schema:
        type: string
        default: '1.0'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Your api key. Request it from Incode support team
      name: x-api-key
      in: header
    IncodeHardwareIdAuth:
      type: apiKey
      description: Session token. Created either via /omni/start or /executive/log-in
      name: X-Incode-Hardware-Id
      in: header
    BearerAuth:
      type: http
      description: 'Bearer token.


        Created via /oauth2/token on auth server, using [client_credentials](https://www.oauth.com/oauth2-servers/access-tokens/client-credentials) grant.


        The client_id and client_secret params can be found in Default client credentials integration.

        '
      scheme: bearer
      bearerFormat: JWT
