openapi: 3.2.0
info:
  title: Incode Omni Curp validation API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Curp validation
paths:
  /api/validate/curp/v4:
    post:
      tags:
      - Curp validation
      summary: CURP validation v4
      description: 'Check for valid CURP and return corresponding values of that person.


        If CURP is not found then renapo_valid field will be false.


        if CURP has invalid format or is not found an error object with details will be returned, for example:


        ```

        {


        "error": { "codigoError": "06", "message": "La CURP no se encuentra en la base de datos" },


        "result": "Not valid request: La CURP no se encuentra en la base de datos code: 06",


        }

        ```'
      operationId: validatecurp4
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurpRequest'
        required: true
      responses:
        '200':
          description: Respuesta con validación de CURP
          content:
            application/json:
              examples:
                Successful CURP Validation:
                  summary: Successful CURP Validation
                  description: Successful CURP Validation
                  value:
                    success: true
                    curp: XXXX820814HDFABC01
                    sex: MUJER
                    nationality: MEX
                    result: success
                    requestData:
                      name: JUANA
                      firstLastName: PEREZ
                      secondLastName: LOPEZ
                      gender: M
                      birthDate: 14/08/1982
                      state: DF
                    transactionId: transaction1234567890
                    renapo_valid: true
                    names: JUANA
                    paternal_surname: PEREZ
                    mothers_maiden_name: LOPEZ
                    birthdate: 14/08/1982
                    entity_birth: DF
                    probation_document: '1'
                    probation_document_data:
                      foja: ''
                      numEntidadReg: 09
                      libro: ''
                      NumRegExtranjeros: ''
                      cveEntidadNac: DF
                      numActa: '00001'
                      CRIP: ''
                      tomo: ''
                      cveEntidadEmisora: ''
                      anioReg: '1982'
                      cveMunicipioReg: '001'
                      FolioCarta: ''
                    status_curp: RCN
                    deceasedStatus: ALIVE
                CURP not found:
                  summary: CURP not found
                  description: CURP not found
                  value:
                    success: false
                    error:
                      codigoError: '06'
                      resultCURPS:
                        numEntidadReg: ''
                        apellidoPaterno: ''
                        libro: ''
                        statusCurp: ''
                        cveEntidadNac: ''
                        numActa: ''
                        CRIP: ''
                        tomo: ''
                        cveEntidadEmisora: ''
                        FolioCertificado: ''
                        anioReg: ''
                        cveMunicipioReg: ''
                        FolioCarta: ''
                        CURP: ''
                        apellidoMaterno: ''
                        nombres: ''
                        nacionalidad: ''
                        foja: ''
                        NumRegExtranjeros: ''
                        fechNac: ''
                        sexo: ''
                        docProbatorio: ''
                      statusOper: NO EXITOSO
                      tipoError: '01'
                      sessionID: xF1hOzrjnJU36wDsPl83KlkDpE-eb7tM1Oe2bjI0jrbPJv-mU3IF!1562844632!1749682961123
                      message: La CURP no se encuentra en la base de datos
                    result: 'Not valid request: La CURP no se encuentra en la base de datos code: 06'
                    transactionId: xF1hOzrjnJU36wDsPl83KlkDpE-eb7tM1Oe2bjI0jrbPJv-mU3IF!1562844632!1749682961123
                    renapo_valid: false
                Daily Rate Limit Exceeded:
                  summary: Daily Rate Limit Exceeded
                  description: Daily Rate Limit Exceeded
                  value:
                    success: false
                    error:
                      codigoError: '02'
                      tipoError: '99'
                      message: SE HA ALCANZADO EL LIMITE DE TRANSACCIONES PERMITIDAS POR DIA
                    result: SE HA ALCANZADO EL LIMITE DE TRANSACCIONES PERMITIDAS POR DIA
                    renapo_valid: false
                Curp status not acceptable:
                  summary: Curp status not acceptable
                  description: Curp status not acceptable
                  value:
                    success: false
                    sessionStatus: Alive
                    error:
                      codigoError: '02'
                      tipoError: '99'
                      message: Curp status is not acceptable.
                    result: 'Error: STATUS CURP not acceptable.'
                    renapo_valid: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '500':
          description: Internal error during CURP validation.
        '504':
          description: The request to validate the CURP exceeded the allowed time limit
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/api-validate-curp-v4/
      x-incode-markdown: https://developer.incode.com/api-reference/api-validate-curp-v4.md
  /api/validate/curp-by-data/v4:
    post:
      tags:
      - Curp validation
      summary: CURP by data validation v4
      description: Check for valid CURP based on a person data and return corresponding values of that person including the CURP.
      operationId: validatecurpbydata4
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurpDataRequest'
        required: true
      responses:
        '200':
          description: 'If data doesn''t match any CURP then the field renapo_valid will be false.


            If there is an error with the request data an error object is returned with the details, example:"

            ```

            { "error": { "descripcionRespuesta": "DATOS INCORRECTOS: [El campo no cumple con el formato.]", "codigoRespuesta": "02", } }

            ```

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurpResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/api-validate-curp-by-data-v4/
      x-incode-markdown: https://developer.incode.com/api-reference/api-validate-curp-by-data-v4.md
