openapi: 3.2.0
info:
  title: Incode Omni Organization API
  description: 'Incode Omni


    Served by Incode Developer Hub at https://developer.incode.com/openapi.json.


    This is the published Omni API specification, annotated with a link from each of its 210 operations to the page documenting it (`externalDocs`, plus `x-incode-markdown` for the Markdown twin).


    9 operation(s) have no page on this site yet and are marked `x-incode-status: undocumented`.


    Schemas are the API''s own — nothing here is re-derived from the documentation.'
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: 0.0.1-SNAPSHOT
  contact:
    name: Incode Developer Hub
    url: https://developer.incode.com/
servers:
- url: https://demo-api.incodesmile.com
  description: Incode demo environment
security:
- ApiKeyAuth: []
  IncodeHardwareIdAuth: []
tags:
- name: Organization
paths:
  /omni/executive-events/find:
    post:
      tags:
      - Organization
      summary: Fetch audit logs
      description: 'Use this API to retrieve records of activities performed within your organization. These logs include key events such as changes to organization settings, executive actions, updates to flows, workflows and user identities, as well as changes made to organization’s watchlist.

        Note: Requires admin login token.'
      operationId: auditLogs
      parameters:
      - name: avoidCounting
        in: query
        required: false
        schema:
          type: boolean
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutiveEventFilter'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveEventResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/executive-events-find/
      x-incode-markdown: https://developer.incode.com/api-reference/executive-events-find.md
  /executive/log-in:
    post:
      tags:
      - Organization
      summary: Login admin token
      description: Logs in an user and provides a token with high-privileges
      operationId: adminLogin
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutiveCognitoLoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveLoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
      - ApiKeyAuth: []
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/executive-log-in/
      x-incode-markdown: https://developer.incode.com/api-reference/executive-log-in.md
  /omni/identity/{customerId}/sessions:
    get:
      tags:
      - Organization
      summary: Fetch all passed onboardings for the same person
      description: Get all passed onboardings for the same person
      operationId: getcustomersessions
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interview'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/identity-sessions/
      x-incode-markdown: https://developer.incode.com/api-reference/identity-sessions.md
  /omni/get/process-batch-status:
    get:
      tags:
      - Organization
      summary: Get batch processing status
      description: Returns the status of the /omni/process/batch progress
      operationId: getprocessbatchstatus
      parameters:
      - in: header
        $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      externalDocs:
        description: Documentation for this endpoint
        url: https://developer.incode.com/api-reference/get-process-batch-status/
      x-incode-markdown: https://developer.incode.com/api-reference/get-process-batch-status.md
