          enum:
          - BIOMETRICS
          - PII
          - FULL
          example: FULL
    IpLocationDto:
      type: object
      properties:
        ipCountry:
          type: string
          description: Country from IP address
          example: United States
        ipRegion:
          type: string
          description: Region from IP address
          example: Texas
        ipCity:
          type: string
          description: City from IP address
          example: Houston
        ipLatitude:
          type: number
          format: double
          description: Latitude from IP address
          example: 29.123456
        ipLongitude:
          type: number
          format: double
          description: Longitude from IP address
          example: -95.123456
    DeviceFingerprintSignalsRequest:
      type: object
      properties:
        metadata:
          type: string
          description: 'HMAC-signed Base64-encoded metadata blob. Format: <hmac>.<base64-encoded-json>. Inner JSON shape: DeviceFingerprintSignalsMetadataDto (fields: timestamp, signalsType, payload, sdkPlatform, sdkVersion, signalsVersion). Server verifies HMAC via the service-configured `hmac_key` and rejects expired/replayed signatures based on the per-tenant CaptureMetadataConfig timestamp threshold.'
          example: abc123def.eyJ0aW1lc3RhbXAiOjE3NDI0NzUxNTE0MTgsLi4ufQ==
          minLength: 1
        interviewEvent:
          type: string
          description: Frontend interview-event code categorizing these signals; resolved against the interview-event dictionary (must be a FRONTEND-sender code, e.g. "captureAttemptFinished").
          example: captureAttemptFinished
          minLength: 1
      required:
      - interviewEvent
      - metadata
    AddDeviceFingerprintResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Flag indicating request passed successfully.
        sessionStatus:
          type: string
          description: Session status
          enum:
          - Alive
          - Closed
          - Deleted
        ipCountry:
          type: string
          description: Current country based on the geolocation Api
        ipState:
          type: string
          description: Current state based on the geolocation Api
        showMandatoryConsent:
          type: boolean
          description: Render mandatory consent page based on this parameter value.
        regulationType:
          type: string
          description: Regulation type for the mandatory consent (only if showMandatoryConsent set to true).
    NameRequest:
      type: object
      properties:
        name:
          type: string
          description: User's name.
