          type: string
        statusUri:
          type: string
    DeviceFingerprintRequest:
      type: object
      properties:
        deviceType:
          type: string
          description: Platform of device
          enum:
          - IOS
          - ANDROID
          - WEBAPP
          example: IOS
        hash:
          type: string
          description: Hash code of the device fingerprint
          example: 42ecaaf4a16e626gt
          maxLength: 255
          minLength: 0
        ip:
          type: string
          description: IP address of the device
          example: 0.0.0.0
          maxLength: 45
          minLength: 0
        ipLocation:
          $ref: '#/components/schemas/IpLocationDto'
          description: Location info based on IP address
        data:
          type: string
          description: Additional data about device
          example:
          - key: userAgent
            value: Mozilla/5.0 (iPhone; CPU iPhone OS 11_0 like Mac OS X) AppleWebKit/604.1.38 (KHTML, like Gecko) Version/11.0 Mobile/15A372 Safari/604.1
          maxLength: 1024
          minLength: 0
        osVersion:
          type: string
          description: OS version. If omitted it is parsed from user agent
          example: iOS 14
          maxLength: 255
          minLength: 0
        deviceModel:
          type: string
          description: Device model. If omitted it is parsed from user agent
          example: iPhone 12
          maxLength: 255
          minLength: 0
        sdkVersion:
          type: string
          description: Version of SDK used
          example: 1
          maxLength: 255
          minLength: 0
        hostingApp:
          type: string
          description: hostingApp. Name of the hosting application
          example: Onboarding
          maxLength: 255
          minLength: 0
        algorithmName:
          type: string
          description: Name of the fingerprinting algorithm used to produce the hash
          example: fingerprintpro
        algorithmVersion:
          type: string
          description: Version of the fingerprinting algorithm used to produce the hash
          example: 1.0.0
      required:
